name: Tests

# `push: branches: ["main"]` saía daqui, e sair é o conserto.
#
# Este workflow e o `cloudflare-pages-deploy.yml` disparavam os DOIS em push
# para a `main`, em paralelo, sem um único `needs` entre eles. Medido no push do
# merge do #44: o deploy terminou às 03:13:17 e a suíte só às 03:17:37. São
# 4m20 em que a página quebrada já estava no ar e o Playwright ainda estava
# rodando. E não havia rede embaixo: `branches/main/protection` responde
# "Branch not protected".
#
# Quem testa a `main` agora é o job `test` do `cloudflare-pages-deploy.yml`,
# entre o `build` e o `deploy`, contra o MESMO artefato que vai ao ar. Aqui
# ficou o portão do Pull Request, que constrói por conta própria: PR de fork não
# recebe artefato, e o preview do revisor não deve esperar a suíte para aparecer.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

# PRs de forks/colaboradores externos exigem aprovação de um admin para rodar
# (configuração de Actions do repositório). Este workflow não usa segredos.
jobs:
  e2e:
    runs-on: ubuntu-latest
    name: Playwright (navegação e links)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build (SSG)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5
