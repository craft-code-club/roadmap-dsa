name: Cloudflare Pages Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  ARTIFACT_NAME: roadmap-dsa-artifact
  CF_PROJECT_NAME: c3-dsa-roadmap

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.md', '**.mdx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          # Apoiadores vêm da APOIA.se no build. Sem os secrets, a lista fica
          # vazia e a página mostra o convite "seja o primeiro".
          APOIASE_TOKEN: ${{ secrets.APOIASE_TOKEN }}
          APOIASE_CAMPAIGN_ID: ${{ secrets.APOIASE_CAMPAIGN_ID }}

      - name: Upload artifact
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 3
          path: ./out

      - name: Skip
        if: github.event.pull_request.head.repo.fork == true
        run: echo "Skipping artifact upload for forked PR"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
      pull-requests: write # To create a comment in the PR
    steps:
      - name: Checkout
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/checkout@v7

      - name: Download a Build Artifact
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./out

      - name: Deploy
        id: deploy
        if: github.event.pull_request.head.repo.fork == false
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CF_PROJECT_NAME }} --branch ${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Preview Url in PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        with:
          header: pr-preview-url
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          message: |
            ### 🚀 **Preview Url** 🚀
            [${{ steps.deploy.outputs.deployment-url }}](${{ steps.deploy.outputs.deployment-url }})

      - name: Skip
        if: github.event.pull_request.head.repo.fork == true
        run: echo "Skipping deploy for forked PR"
