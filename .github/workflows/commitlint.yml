name: Commitlint

# Valida as mensagens de commit no padrão Conventional Commits em cada PR.
# Regras: commitlint.config.mjs. Guia: CONTRIBUTING.md.
on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # A action lista os commits do PR pela API. Sem esta permissão ela morre com
  # "Resource not accessible by integration" e o job reprova qualquer PR, mesmo
  # com as mensagens corretas.
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Valida mensagens de commit
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint dos commits do PR
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
